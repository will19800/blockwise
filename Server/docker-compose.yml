services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BLOCKWISE_DATA_PATH: /var/lib/blockwise/blockwise.sqlite
      BLOCKWISE_RELAY_ADDR: ":8080"
    ports:
      - "8080:8080"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - relay-data:/var/lib/blockwise

volumes:
  relay-data:

